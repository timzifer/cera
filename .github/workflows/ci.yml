name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [go.mod, stable]
        exclude:
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test (race, coverage)
        if: runner.os == 'Linux'
        run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.go == 'go.mod'
        with:
          name: coverage
          path: coverage.out

  # Total statement coverage of the root module, from the test job's
  # profile. On main it is published as a shields.io endpoint to the badges
  # branch, which the README's coverage badge reads.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Total
        id: total
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Coverage: **$pct %**" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.total.outputs.pct }}
          TOKEN: ${{ github.token }}
        run: |
          color=$(awk -v p="$PCT" 'BEGIN { print p >= 80 ? "brightgreen" : p >= 70 ? "green" : p >= 60 ? "yellow" : p >= 50 ? "orange" : "red" }')
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > "$dir/coverage.json"
          cd "$dir"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Coverage $PCT % at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" badges

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build without cgo for every target
        env:
          CGO_ENABLED: "0"
        run: |
          for t in linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 linux/ppc64le linux/s390x \
                   darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64 js/wasm wasip1/wasm; do
            echo "::group::$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./... || exit 1
            echo "::endgroup::"
          done
      - name: Build and test without the TeX Gyre stand-ins (cera_nogyre)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=js GOARCH=wasm go build -tags cera_nogyre ./... || exit 1
          go test -tags cera_nogyre .

  # Every reader of untrusted structure, 60 s each (ADR 0010); the weekly
  # workflow fuzzes longer. Crashers land in testdata/fuzz and are kept as
  # regression inputs.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: FuzzContent, pkg: . }
          - { name: FuzzImage, pkg: . }
          - { name: FuzzTransparency, pkg: . }
          - { name: FuzzShading, pkg: . }
          - { name: FuzzPattern, pkg: . }
          - { name: FuzzICC, pkg: . }
          - { name: FuzzLayers, pkg: . }
          - { name: FuzzForm, pkg: . }
          - { name: FuzzRepair, pkg: . }
          - { name: FuzzScan, pkg: ./internal/content }
          - { name: FuzzParse, pkg: ./internal/cmap }
          - { name: FuzzParseObject, pkg: ./internal/pdf }
          - { name: FuzzOpen, pkg: ./internal/pdf }
          - { name: FuzzFilters, pkg: ./internal/pdf }
          - { name: FuzzReaderAt, pkg: ./internal/pdf }
          - { name: FuzzToUnicode, pkg: ./internal/pdffont }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s ${{ matrix.target.pkg }}
      - name: Keep crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.target.name }}
          path: |
            testdata/fuzz
            internal/content/testdata/fuzz
            internal/cmap/testdata/fuzz
            internal/pdf/testdata/fuzz
            internal/pdffont/testdata/fuzz

  # cera's own reader against go-pdfkit/reader v0.6.0, the one it replaces
  # (ADR 0012): every object, decoded stream and page of the pinned corpus
  # must agree, except for differences readerdiff/allowlist.txt names with a
  # reason. readerdiff is a module of its own so go-pdfkit stays out of
  # cera's go.mod.
  readerdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: readerdiff/go.mod
          cache-dependency-path: readerdiff/go.sum
      - name: go mod tidy, vet and test
        working-directory: readerdiff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
      - uses: actions/cache@v6
        with:
          path: testdata/corpus
          key: corpus-${{ hashFiles('internal/corpus/manifest.json') }}
      - name: Fetch corpus (SHA-256 verified)
        run: go run ./cmd/corpus fetch -dir testdata/corpus
      - name: Write synthetic drawings
        run: go run ./cmd/corpus scenes -dir testdata/corpus
      - name: Compare the readers
        working-directory: readerdiff
        run: |
          go run . objects -a v06 -b pdf -dir ../testdata/corpus
          go run . objects -a v06 -b pdfra -dir ../testdata/corpus
      - name: Compare the font layers
        working-directory: readerdiff
        run: go run . fonts -dir ../testdata/corpus
      - name: Benchmark the readers
        working-directory: readerdiff
        run: |
          go test -run '^$' -bench . -benchmem -count 5 | tee bench.txt
          go run golang.org/x/perf/cmd/benchstat@latest -col /reader bench.txt >> "$GITHUB_STEP_SUMMARY" || true

  # Pinned corpus (pdf.js feature files, arXiv papers, synthetic technical
  # drawings): every page must render without panic, hang or deadline.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: testdata/corpus
          key: corpus-${{ hashFiles('internal/corpus/manifest.json') }}
      - name: Fetch corpus (SHA-256 verified)
        run: go run ./cmd/corpus fetch -dir testdata/corpus
      - name: Write synthetic drawings
        run: go run ./cmd/corpus scenes -dir testdata/corpus
      - name: Render at 150 dpi
        run: go run ./cmd/corpus run -dir testdata/corpus -dpi 150 -runs 3 -timeout 60s -out report
      - name: Summary
        if: always()
        run: test -f report/report.md && cat report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-report
          path: report

  # Accuracy against PDFium on the pinned corpus (ADR 0010): a file whose
  # worst page differs more than the threshold pinned in
  # accuracy/thresholds.json fails. PDFium's renderings are cached by corpus.
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: accuracy/go.mod
          cache-dependency-path: accuracy/go.sum
      - name: go mod tidy, vet and test
        working-directory: accuracy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test ./...
      # The local reference tool links MuPDF through cgo; without cgo it
      # builds without it (and go-fitz is not downloaded).
      - name: Vet and test the reference tool (no cgo)
        working-directory: accuracy/reference
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
      - uses: actions/cache@v6
        with:
          path: |
            testdata/corpus
            testdata/pdfium
          key: pdfium-150dpi-${{ hashFiles('internal/corpus/manifest.json', 'internal/corpus/synthetic.go', 'accuracy/go.sum') }}
      - name: Fetch corpus (SHA-256 verified)
        run: go run ./cmd/corpus fetch -dir testdata/corpus
      - name: Write synthetic drawings
        run: go run ./cmd/corpus scenes -dir testdata/corpus
      - name: Compare with PDFium at 150 dpi
        working-directory: accuracy
        run: go run . -dir ../testdata/corpus -dpi 150 -thresholds thresholds.json -refs ../testdata/pdfium -out ../report-accuracy
      - name: Summary
        if: always()
        run: test -f report-accuracy/report.md && cat report-accuracy/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accuracy-report
          path: report-accuracy

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Benchmarks
        run: |
          go test -run '^$' -bench . -benchmem -count 5 . ./internal/content ./internal/pdf | tee bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench
          path: bench.txt

  # The fyne form provider is a module of its own (ADR 0006), so that cera
  # never depends on cgo; fyne needs cgo and the GL and X11 headers.
  fyneform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form/fyneform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: form/fyneform/go.mod
          cache-dependency-path: form/fyneform/go.sum
      - name: Install fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

  # The CJK fonts are a module of their own (ADR 0008), so that no binary
  # links tens of megabytes of glyphs without asking for them.
  cjk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fonts/cjk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: fonts/cjk/go.mod
          cache-dependency-path: fonts/cjk/go.sum
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

  # The single required status check for main (see .github/rulesets).
  ci-ok:
    if: always()
    needs: [lint, test, coverage, cross, fuzz, readerdiff, corpus, accuracy, bench, fyneform, cjk]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
