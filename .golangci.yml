version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - (*compress/zlib.Writer).Write
        - (*compress/zlib.Writer).Close
        - (*encoding/csv.Writer).Write
        - (*flag.FlagSet).Parse # ExitOnError
    misspell:
      ignore-rules:
        - stilus

formatters:
  enable:
    - gofmt
